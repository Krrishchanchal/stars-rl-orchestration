# toy-v1: authored connectivity, not an orbit. All quantities include units.
# Schema validation does not establish network feasibility (C05-C08).
schema_version: 1
scenario_id: toy-v1
family_id: toy-v1
family_classification: authored_toy
window_count: 3
window_seconds: 60
metadata:
  scenario_group_id: toy-v1
  root_lineage_id: toy-v1
  constellation_id: synthetic-three-hosts
  layout_id: toy-layout-v1
  demand_family_id: toy-demand-v1
  epoch_utc: null
  interval_start_seconds: 0
  interval_end_seconds: 180
  generation:
    method: authored
    rng_algorithm: null
    rng_library_version: null
    seeds: []
    draws: []
radio:
  carrier_hz: 14000000000
  transmit_watts: 0.1
  user_gain_dbi: 15
  satellite_gain_dbi: 40
  bandwidth_hz: 100000000
  temperature_kelvin: 290
  interference_model: exogenous
  external_interference_watts: 0
  speed_of_light_mps: 299792458
  boltzmann_joules_per_kelvin: 1.380649e-23
function_types:
  - {id: f0, psi_instructions_per_bit: 10, omega_instructions_per_bit: 10, base_overhead_mips: 5}
  - {id: f1, psi_instructions_per_bit: 20, omega_instructions_per_bit: 20, base_overhead_mips: 10}
slices:
  - {id: slice0, chain: [f0, f1], demand_mbps: 2, packet_bits: 12000, delay_limit_seconds: 0.05}
  - {id: slice1, chain: [f0, f1], demand_mbps: 3, packet_bits: 12000, delay_limit_seconds: 0.05}
# Synthetic users/GS have no physical coordinates. Distances are authored below.
users:
  - {id: u0, slice_id: slice0, coordinates: null}
  - {id: u1, slice_id: slice1, coordinates: null}
ground_stations:
  - {id: g0, coordinates: null}
satellites:
  - {id: s0, cpu_capacity_mips: 200, access_capacity: 2, egress_capacity: 2, max_active_instances: 4}
  - {id: s1, cpu_capacity_mips: 300, access_capacity: 2, egress_capacity: 2, max_active_instances: 4}
  - {id: s2, cpu_capacity_mips: 0, access_capacity: 0, egress_capacity: 0, max_active_instances: 0}
# Identity is (function_type_id, instance_id, satellite_id), including on s2.
instances:
  - {function_type_id: f0, instance_id: i0, satellite_id: s0}
  - {function_type_id: f0, instance_id: i1, satellite_id: s0}
  - {function_type_id: f1, instance_id: i0, satellite_id: s0}
  - {function_type_id: f1, instance_id: i1, satellite_id: s0}
  - {function_type_id: f0, instance_id: i0, satellite_id: s1}
  - {function_type_id: f0, instance_id: i1, satellite_id: s1}
  - {function_type_id: f1, instance_id: i0, satellite_id: s1}
  - {function_type_id: f1, instance_id: i1, satellite_id: s1}
  - {function_type_id: f0, instance_id: i0, satellite_id: s2}
  - {function_type_id: f0, instance_id: i1, satellite_id: s2}
  - {function_type_id: f1, instance_id: i0, satellite_id: s2}
  - {function_type_id: f1, instance_id: i1, satellite_id: s2}
# An access schedule lists exactly the visible edges for each window.
# Missing edges are invisible; there is no resampling or implicit fallback.
access_schedule:
  - window_index: 0
    links:
      - {user_id: u0, satellite_id: s0, distance_m: 500000}
      - {user_id: u0, satellite_id: s1, distance_m: 500000}
      - {user_id: u1, satellite_id: s0, distance_m: 500000}
      - {user_id: u1, satellite_id: s1, distance_m: 500000}
  - window_index: 1
    links:
      - {user_id: u0, satellite_id: s1, distance_m: 500000}
      - {user_id: u1, satellite_id: s0, distance_m: 500000}
      - {user_id: u1, satellite_id: s1, distance_m: 500000}
  - window_index: 2
    links:
      - {user_id: u0, satellite_id: s1, distance_m: 500000}
      - {user_id: u1, satellite_id: s0, distance_m: 500000}
      - {user_id: u1, satellite_id: s1, distance_m: 500000}
# These GS links and undirected ISLs stay constant for the authored episode.
ground_links:
  - {satellite_id: s0, ground_station_id: g0, distance_m: 500000}
  - {satellite_id: s1, ground_station_id: g0, distance_m: 500000}
isl_links:
  - {satellite_a_id: s0, satellite_b_id: s1, distance_m: 100000}
  - {satellite_a_id: s1, satellite_b_id: s2, distance_m: 100000}
